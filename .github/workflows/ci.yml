name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Se ejecuta cuando creas una Release en GitHub
  release:
    types: [created]

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'

    - name: Install dependencies (Frozen Lockfile)
      run: yarn install --frozen-lockfile

    - name: Type Check
      run: yarn typecheck

    - name: Run Tests
      run: yarn test

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        directory: ./test-reports/coverage
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  publish:
    name: Publish to NPM
    needs: build-and-test # Solo publica si los tests pasaron
    if: github.event_name == 'release' # Solo corre en releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js for Publishing
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      # El Trusted Publisher (OIDC) requiere npm >= 11.5.1; node 22.x trae npm 10.x.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Package
        run: yarn build

      # Sin NODE_AUTH_TOKEN: el Trusted Publisher (OIDC) configurado en npm
      # autentica via el id-token de Actions (permissions.id-token: write).
      # La provenance se genera automaticamente al publicar via OIDC.
      - name: Publish to NPM (OIDC trusted publisher)
        run: npm publish --access public
